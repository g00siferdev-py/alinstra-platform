# Web service only. In the Railway service settings, set the config file path to
# railway.web.toml. Migrations run here, once, before the new web instance starts.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
preDeployCommand = "pnpm --filter @alinstra/db exec prisma migrate deploy"
startCommand = "pnpm --filter @alinstra/web start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
