name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alinstra
          POSTGRES_PASSWORD: alinstra
          POSTGRES_DB: alinstra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alinstra -d alinstra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_INITIAL_PASSWORD: ci-admin-password
      DATABASE_URL: postgresql://alinstra:alinstra@localhost:5432/alinstra_test?schema=public
      REDIS_URL: redis://localhost:6379
      EMAIL_FROM: notifications@alinstra.com
      EMAIL_TRANSPORT: console
      LOCKOUT_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
      # pg_dump, pg_restore and psql for the backup restore drill (apps/worker backup.integration.test.ts), which
      # skips itself when they are missing. The client must be >= the postgres service major (16).
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alinstra/db generate
      - run: pnpm db:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Catch Turbopack/"use server" and prerender failures that unit tests miss.
      # Placeholder env matches apps/web/Dockerfile; DATABASE_URL is unreachable (no Postgres in this step).
      - name: Production web build (no database)
        env:
          NODE_ENV: production
          NEXT_PHASE: phase-production-build
          APP_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: build-time-placeholder-secret-32-chars-min
          ENCRYPTION_KEY: build-time-placeholder-not-a-real-key
          ADMIN_EMAIL: build@example.com
          DATABASE_URL: postgresql://alinstra:alinstra@127.0.0.1:1/alinstra?schema=public&connect_timeout=1
          REDIS_URL: redis://127.0.0.1:1
          EMAIL_FROM: notifications@alinstra.com
          EMAIL_TRANSPORT: resend
          RESEND_API_KEY: build-placeholder
        run: pnpm --filter @alinstra/web build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on high/critical production advisories unless listed (with reason + expiry) in audit-allowlist.json.
      - name: Dependency audit
        run: node scripts/check-audit.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      # Release binary (checksum-verified) rather than the license-gated gitleaks-action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
      - name: Scan for secrets
        run: gitleaks detect --redact --no-banner --config .gitleaks.toml
