# Local Phase 0 stack: Postgres, Redis, web, and worker.
#
# Fast path (host processes, recommended while coding):
#   docker compose up -d postgres redis
#   pnpm db:migrate && pnpm db:seed
#   pnpm dev:web
#   pnpm dev:worker
#
# Full stack:
#   docker compose up -d --build
#
# Apply migrations from the host before the web container serves traffic.
# The worker never runs migrations.

services:
  postgres:
    image: postgres:16-alpine
    container_name: alinstra-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: alinstra
      POSTGRES_PASSWORD: alinstra
      POSTGRES_DB: alinstra
    volumes:
      - alinstra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alinstra -d alinstra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alinstra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - alinstra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: alinstra-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      EMAIL_TRANSPORT: console
      DATABASE_URL: postgresql://alinstra:alinstra@postgres:5432/alinstra?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: alinstra-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      EMAIL_TRANSPORT: console
      DATABASE_URL: postgresql://alinstra:alinstra@postgres:5432/alinstra?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  alinstra_pg_data:
  alinstra_redis_data:
